<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke="inherit"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#0D1117"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#E8EAF0" font-size="18" font-weight="700">Smart Billing System — Hardware Connection Diagram</text>
  <line x1="60" y1="46" x2="840" y2="46" stroke="#2A2F3A" stroke-width="1"/>

  <!-- ─────────────── RASPBERRY PI 4 (centre) ─────────────── -->
  <rect x="330" y="65" width="240" height="430" rx="12" fill="#003822" stroke="#00E5A0" stroke-width="2.5"/>
  <rect x="330" y="65" width="240" height="42" rx="12" fill="#005533" stroke="none"/>
  <rect x="330" y="96" width="240" height="11" fill="#005533" stroke="none"/>
  <text x="450" y="91" text-anchor="middle" fill="#00E5A0" font-size="14" font-weight="700">Raspberry Pi 4</text>

  <!-- GPIO pin rows on left side of Pi -->
  <!-- Pin labels inside Pi (left side) -->
  <text x="345" y="152" fill="#6B7280" font-size="10">Pin 1  — 3.3V</text>
  <text x="345" y="192" fill="#6B7280" font-size="10">Pin 6  — GND</text>
  <text x="345" y="232" fill="#00E5A0" font-size="10" font-weight="600">Pin 38 — GPIO 20 (DT)</text>
  <text x="345" y="272" fill="#0066FF" font-size="10" font-weight="600">Pin 40 — GPIO 21 (SCK)</text>
  <text x="345" y="342" fill="#FF6B35" font-size="10" font-weight="600">CSI Camera Port</text>
  <text x="345" y="362" fill="#6B7280" font-size="10">(between USB &amp; HDMI)</text>

  <!-- GPIO connector pads on LEFT edge of Pi -->
  <rect x="326" y="142" width="8" height="20" rx="2" fill="#FD6925"/>
  <rect x="326" y="182" width="8" height="20" rx="2" fill="#888888"/>
  <rect x="326" y="222" width="8" height="20" rx="2" fill="#00E5A0"/>
  <rect x="326" y="262" width="8" height="20" rx="2" fill="#0066FF"/>

  <!-- CSI port on right side of Pi -->
  <rect x="566" y="332" width="8" height="30" rx="2" fill="#FF6B35"/>

  <!-- Pi labels right side -->
  <text x="485" y="152" fill="#6B7280" font-size="10">3.3V Power</text>
  <text x="485" y="192" fill="#6B7280" font-size="10">Ground</text>
  <text x="485" y="232" fill="#00E5A0" font-size="10">Data line</text>
  <text x="485" y="272" fill="#0066FF" font-size="10">Clock line</text>

  <!-- Software stack note inside Pi -->
  <rect x="350" y="400" width="200" height="80" rx="8" fill="#001A0F" stroke="#00E5A0" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="450" y="420" text-anchor="middle" fill="#00E5A0" font-size="11" font-weight="700">Software Stack</text>
  <text x="450" y="438" text-anchor="middle" fill="#E8EAF0" font-size="10">main.py — detection loop</text>
  <text x="450" y="454" text-anchor="middle" fill="#E8EAF0" font-size="10">server.py — Flask :5000</text>
  <text x="450" y="470" text-anchor="middle" fill="#6B7280" font-size="9">Python 3  ·  scikit-learn  ·  picamera2</text>

  <!-- ─────────────── HX711 MODULE ─────────────── -->
  <rect x="100" y="160" width="160" height="150" rx="10" fill="#1E2229" stroke="#00E5A0" stroke-width="2"/>
  <text x="180" y="185" text-anchor="middle" fill="#00E5A0" font-size="13" font-weight="700">HX711 ADC</text>
  <text x="180" y="202" text-anchor="middle" fill="#6B7280" font-size="10">24-bit Load Cell Amplifier</text>

  <!-- HX711 pin labels -->
  <text x="115" y="228" fill="#FD6925" font-size="11" font-weight="600">VCC</text>
  <text x="115" y="252" fill="#888888" font-size="11" font-weight="600">GND</text>
  <text x="115" y="276" fill="#00E5A0" font-size="11" font-weight="600">DT</text>
  <text x="115" y="300" fill="#0066FF" font-size="11" font-weight="600">SCK</text>

  <!-- HX711 right-side connector pads -->
  <rect x="258" y="218" width="8" height="20" rx="2" fill="#FD6925"/>
  <rect x="258" y="242" width="8" height="20" rx="2" fill="#888888"/>
  <rect x="258" y="266" width="8" height="20" rx="2" fill="#00E5A0"/>
  <rect x="258" y="290" width="8" height="20" rx="2" fill="#0066FF"/>

  <!-- ─────────────── WIRES: HX711 → Pi ─────────────── -->
  <!-- 3.3V: orange -->
  <line x1="266" y1="228" x2="305" y2="228" stroke="#FD6925" stroke-width="2.5"/>
  <line x1="305" y1="228" x2="305" y2="152" stroke="#FD6925" stroke-width="2.5"/>
  <line x1="305" y1="152" x2="326" y2="152" stroke="#FD6925" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- GND: grey -->
  <line x1="266" y1="252" x2="308" y2="252" stroke="#888888" stroke-width="2.5"/>
  <line x1="308" y1="252" x2="308" y2="192" stroke="#888888" stroke-width="2.5"/>
  <line x1="308" y1="192" x2="326" y2="192" stroke="#888888" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- DT: green -->
  <line x1="266" y1="276" x2="311" y2="276" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="311" y1="276" x2="311" y2="232" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="311" y1="232" x2="326" y2="232" stroke="#00E5A0" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- SCK: blue -->
  <line x1="266" y1="300" x2="314" y2="300" stroke="#0066FF" stroke-width="2.5"/>
  <line x1="314" y1="300" x2="314" y2="272" stroke="#0066FF" stroke-width="2.5"/>
  <line x1="314" y1="272" x2="326" y2="272" stroke="#0066FF" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ─────────────── LOAD CELL ─────────────── -->
  <rect x="68" y="365" width="180" height="130" rx="10" fill="#1E2229" stroke="#FF6B35" stroke-width="2"/>
  <text x="158" y="390" text-anchor="middle" fill="#FF6B35" font-size="13" font-weight="700">Load Cell</text>
  <text x="158" y="408" text-anchor="middle" fill="#6B7280" font-size="10">Strain gauge sensor (1kg / 5kg)</text>

  <!-- Load cell wire colours -->
  <rect x="88" y="422" width="16" height="12" rx="2" fill="#FF2222"/>
  <text x="112" y="432" fill="#E8EAF0" font-size="11">Red    — E+ (Excitation +)</text>
  <rect x="88" y="442" width="16" height="12" rx="2" fill="#222222" stroke="#666" stroke-width="1"/>
  <text x="112" y="452" fill="#E8EAF0" font-size="11">Black  — E− (Excitation −)</text>
  <rect x="88" y="462" width="16" height="12" rx="2" fill="#FFFFFF"/>
  <text x="112" y="472" fill="#E8EAF0" font-size="11">White  — A+ (Signal +)</text>
  <rect x="88" y="482" width="16" height="12" rx="2" fill="#22AA22"/>
  <text x="112" y="492" fill="#E8EAF0" font-size="11">Green  — A− (Signal −)</text>

  <!-- Load Cell → HX711 arrow -->
  <line x1="158" y1="365" x2="158" y2="310" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ah)"/>
  <text x="168" y="340" fill="#FF6B35" font-size="10">4-wire</text>

  <!-- ─────────────── PI CAMERA MODULE ─────────────── -->
  <rect x="650" y="270" width="190" height="130" rx="10" fill="#1E2229" stroke="#FF6B35" stroke-width="2"/>
  <text x="745" y="295" text-anchor="middle" fill="#FF6B35" font-size="13" font-weight="700">Pi Camera v2</text>
  <text x="745" y="313" text-anchor="middle" fill="#6B7280" font-size="10">Sony IMX219 · 8MP</text>
  <text x="745" y="333" text-anchor="middle" fill="#6B7280" font-size="10">FOV: 62.2° × 48.8°</text>

  <text x="665" y="358" fill="#E8EAF0" font-size="11">Interface:  CSI 15-pin ribbon</text>
  <text x="665" y="376" fill="#E8EAF0" font-size="11">Connect to: Pi CSI port</text>
  <text x="665" y="394" fill="#6B7280" font-size="10">(between USB-A and HDMI)</text>

  <!-- Camera → Pi arrow -->
  <line x1="650" y1="345" x2="579" y2="345" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="595" y="338" fill="#FF6B35" font-size="10">CSI</text>

  <!-- ─────────────── WEB/UPI OUTPUT BOX ─────────────── -->
  <rect x="650" y="65" width="190" height="175" rx="10" fill="#1E2229" stroke="#0066FF" stroke-width="2"/>
  <text x="745" y="90" text-anchor="middle" fill="#4D9FFF" font-size="13" font-weight="700">Web Dashboard</text>
  <text x="745" y="108" text-anchor="middle" fill="#6B7280" font-size="10">Flask server on :5000</text>

  <text x="665" y="132" fill="#E8EAF0" font-size="11" font-weight="600">User:</text>
  <text x="665" y="150" fill="#6B7280" font-size="10">Live cart  ·  UPI QR code</text>
  <text x="665" y="166" fill="#6B7280" font-size="10">Bill history  ·  Checkout</text>

  <text x="665" y="190" fill="#E8EAF0" font-size="11" font-weight="600">Admin:</text>
  <text x="665" y="208" fill="#6B7280" font-size="10">Products  ·  Train AI</text>
  <text x="665" y="224" fill="#6B7280" font-size="10">Excel export  ·  Retrain</text>

  <!-- Pi → Dashboard arrow -->
  <line x1="570" y1="160" x2="646" y2="160" stroke="#0066FF" stroke-width="2" marker-end="url(#ah)"/>
  <text x="590" y="154" fill="#0066FF" font-size="9">HTTP :5000</text>

  <!-- ─────────────── CALIBRATION INFO ─────────────── -->
  <rect x="68" y="65" width="220" height="80" rx="10" fill="#1E2229" stroke="#FFC107" stroke-width="1.5"/>
  <text x="178" y="88" text-anchor="middle" fill="#FFC107" font-size="12" font-weight="700">Calibration Values</text>
  <text x="88" y="108" fill="#E8EAF0" font-size="11">CALIB_FACTOR = 507.1</text>
  <text x="88" y="124" fill="#E8EAF0" font-size="11">DT_PIN  = GPIO 20   SCK_PIN = GPIO 21</text>
  <text x="88" y="140" fill="#6B7280" font-size="10">Adjust CALIB_FACTOR with a known weight</text>

  <!-- Legend -->
  <rect x="68" y="510" width="760" height="38" rx="6" fill="#161920" stroke="#2A2F3A" stroke-width="1"/>
  <text x="88" y="525" fill="#6B7280" font-size="10">Wire legend:</text>
  <rect x="155" y="515" width="16" height="10" rx="2" fill="#FD6925"/>
  <text x="175" y="525" fill="#E8EAF0" font-size="10">3.3V Power</text>
  <rect x="265" y="515" width="16" height="10" rx="2" fill="#888888"/>
  <text x="285" y="525" fill="#E8EAF0" font-size="10">Ground</text>
  <rect x="360" y="515" width="16" height="10" rx="2" fill="#00E5A0"/>
  <text x="380" y="525" fill="#E8EAF0" font-size="10">DT (Data)</text>
  <rect x="460" y="515" width="16" height="10" rx="2" fill="#0066FF"/>
  <text x="480" y="525" fill="#E8EAF0" font-size="10">SCK (Clock)</text>
  <rect x="565" y="515" width="16" height="10" rx="2" fill="#FF6B35"/>
  <text x="585" y="525" fill="#E8EAF0" font-size="10">Camera / Load Cell</text>

  <text x="88" y="542" fill="#6B7280" font-size="10">MIN_WEIGHT = 30g  ·  REMOVE_BELOW = 40g  ·  MIN_CONFIDENCE = 0.40  ·  BCM pin numbering</text>
</svg>
